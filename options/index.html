<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#02090b">
  <meta name="description" content="Project E.R.A.S. : Universe options.">
  <title>Options — Project E.R.A.S. : Universe</title>
  <link rel="stylesheet" href="/game/assets/css/site.css">
  <script type="module" src="/assets/js/eras-module-theme.js?v=20260905-t1"></script>
</head>
<body class="universe-home options-page">
  <div class="universe-frame" aria-hidden="true">
    <i class="uf-corner uf-tl"></i><i class="uf-corner uf-tr"></i>
    <i class="uf-corner uf-bl"></i><i class="uf-corner uf-br"></i>
    <span class="uf-line uf-top"></span><span class="uf-line uf-bottom"></span>
    <span class="uf-line uf-left"></span><span class="uf-line uf-right"></span>
    <span class="uf-ticks uf-ticks-top"></span><span class="uf-ticks uf-ticks-bottom"></span>
  </div>

  <header class="site-header">
    <a class="brand" href="/" aria-label="Project E.R.A.S. Universe home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>PROJECT E.R.A.S. <b>: UNIVERSE</b></span>
    </a>
    <a class="enter-button" href="/" data-home-link aria-label="Return to Project E.R.A.S. Universe home">HOME</a>
  </header>

  <main class="options-landing" aria-label="Project E.R.A.S. Universe options">
    <div class="cosmos" aria-hidden="true">
      <div class="stars stars-a"></div>
      <div class="stars stars-b"></div>
      <div class="nebula nebula-a"></div>
      <div class="nebula nebula-b"></div>
      <div class="grid-haze"></div>
    </div>

    <div class="options-ring-field" aria-hidden="true">
      <div class="hollow-ring ring-a"><span></span></div>
      <div class="hollow-ring ring-b"><span></span></div>
      <div class="hollow-ring ring-c"><span></span></div>
      <div class="hollow-ring ring-d"><span></span></div>
      <div class="ring-core-mark"></div>
    </div>

    <section class="options-panel" aria-labelledby="options-title">
      <div class="options-heading">
        <span>SYSTEM CONFIGURATION</span>
        <h1 id="options-title">OPTIONS</h1>
      </div>

      <div class="option-stack">
        <label class="option-row" for="master-volume">
          <span class="option-label">MASTER VOLUME</span>
          <span class="range-shell">
            <input id="master-volume" data-option="masterVolume" type="range" min="0" max="100" value="100" aria-label="Master volume">
            <output for="master-volume" data-output="masterVolume">100</output>
          </span>
        </label>

        <label class="option-row" for="music-volume">
          <span class="option-label">MUSIC VOLUME</span>
          <span class="range-shell">
            <input id="music-volume" data-option="musicVolume" type="range" min="0" max="100" value="100" aria-label="Music volume">
            <output for="music-volume" data-output="musicVolume">100</output>
          </span>
        </label>

        <label class="option-row" for="fx-volume">
          <span class="option-label">FX VOLUME</span>
          <span class="range-shell">
            <input id="fx-volume" data-option="fxVolume" type="range" min="0" max="100" value="100" aria-label="Effects volume">
            <output for="fx-volume" data-output="fxVolume">100</output>
          </span>
        </label>

        <div class="option-row graphics-row">
          <span class="option-label">GRAPHICS SETTING</span>
          <div class="graphics-toggle" role="group" aria-label="Graphics setting">
            <button type="button" class="graphics-choice" data-graphics="low" aria-pressed="false">LOW</button>
            <span aria-hidden="true">/</span>
            <button type="button" class="graphics-choice is-selected" data-graphics="high" aria-pressed="true">HIGH</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/game/assets/js/site.js"></script>
</body>
</html>
