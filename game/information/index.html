<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#02090b">
  <meta name="description" content="Project E.R.A.S. : Universe system information.">
  <title>Information — Project E.R.A.S. : Universe</title>
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body class="universe-home info-page">
  <div class="universe-frame" aria-hidden="true">
    <i class="uf-corner uf-tl"></i><i class="uf-corner uf-tr"></i>
    <i class="uf-corner uf-bl"></i><i class="uf-corner uf-br"></i>
    <span class="uf-line uf-top"></span><span class="uf-line uf-bottom"></span>
    <span class="uf-line uf-left"></span><span class="uf-line uf-right"></span>
    <span class="uf-ticks uf-ticks-top"></span><span class="uf-ticks uf-ticks-bottom"></span>
  </div>

  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="Project E.R.A.S. Universe home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>PROJECT E.R.A.S. <b>: UNIVERSE</b></span>
    </a>
    <a class="enter-button" href="../index.html" data-home-link aria-label="Return to Project E.R.A.S. Universe home">HOME</a>
  </header>

  <main class="info-landing" aria-label="Project E.R.A.S. Universe information">
    <div class="cosmos" aria-hidden="true">
      <div class="stars stars-a"></div>
      <div class="stars stars-b"></div>
      <div class="nebula nebula-a"></div>
      <div class="nebula nebula-b"></div>
      <div class="grid-haze"></div>
    </div>

    <section class="info-stage" aria-label="Orbital system information">
      <div class="info-axis info-axis-x" aria-hidden="true"></div>
      <div class="info-axis info-axis-y" aria-hidden="true"></div>
      <div class="info-center-mark" aria-hidden="true"></div>

      <div class="info-orbit info-orbit-a" aria-hidden="true">
        <div class="info-orbiter info-orbiter-a"><span class="asteroid asteroid-a"></span></div>
      </div>
      <div class="info-orbit info-orbit-b" aria-hidden="true">
        <div class="info-orbiter info-orbiter-b"><span class="asteroid asteroid-b comet"></span></div>
      </div>
      <div class="info-orbit info-orbit-c" aria-hidden="true">
        <div class="info-orbiter info-orbiter-c"><span class="asteroid asteroid-c"></span></div>
      </div>
    </section>

    <section class="info-readouts" aria-label="System information readouts">
      <div class="info-readout version-readout">
        <span>VERSION</span>
        <strong>0.1</strong>
      </div>
      <div class="info-readout status-readout">
        <span>SERVER STATUS</span>
        <strong class="server-status status-online" data-server-status="online">ONLINE</strong>
      </div>
      <div class="info-readout">
        <span>ONLINE</span>
        <strong><b data-online-count>0</b> PLAYERS</strong>
      </div>
    </section>
  </main>

  <script src="../assets/js/site.js"></script>
</body>
</html>
