<!doctype html>
<html lang="en">
<head><script src="/game/assets/js/mobile-route.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#02090b">
  <meta name="description" content="E.R.A.S. play network — host, join, or enter the global world.">
  <title>Play — Project E.R.A.S.</title>
  <link rel="stylesheet" href="./assets/css/site.css">
  <link rel="stylesheet" href="/account/assets/css/account-button.css">
  <link rel="stylesheet" href="./assets/css/runtime.css?v=1.4.3">
<link rel="stylesheet" href="/assets/css/direct-messaging.css?v=20260901-dm5">
</head>
<body class="universe-home play-hub-page">
  <div class="universe-frame" aria-hidden="true">
    <i class="uf-corner uf-tl"></i><i class="uf-corner uf-tr"></i><i class="uf-corner uf-bl"></i><i class="uf-corner uf-br"></i>
    <span class="uf-line uf-top"></span><span class="uf-line uf-bottom"></span><span class="uf-line uf-left"></span><span class="uf-line uf-right"></span>
    <span class="uf-ticks uf-ticks-top"></span><span class="uf-ticks uf-ticks-bottom"></span>
  </div>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Project E.R.A.S. Universe home"><span class="brand-mark" aria-hidden="true"></span><span>PROJECT E.R.A.S. <b>: PLAY</b></span></a>
    <button class="eras-dm-launch" type="button" data-eras-messages>CHAT</button><div class="portal-auth-area" id="portalAuthArea" aria-live="polite"><div class="portal-auth-loading">CHECKING ACCOUNT…</div></div>
  </header>

  <main class="universe-landing play-hub">
    <div class="cosmos" aria-hidden="true"><div class="stars stars-a"></div><div class="stars stars-b"></div><div class="nebula nebula-a"></div><div class="nebula nebula-b"></div><div class="grid-haze"></div></div>
    <section class="play-system" aria-label="E.R.A.S. game access">
      <div class="axis axis-x" aria-hidden="true"></div><div class="axis axis-y" aria-hidden="true"></div>
      <div class="orbit orbit-outer" aria-hidden="true"></div><div class="orbit orbit-middle" aria-hidden="true"></div><div class="orbit orbit-inner" aria-hidden="true"></div><div class="scan-ring" aria-hidden="true"></div>

      <a class="play-moving-node host-node" href="/game/host/" aria-label="Host a game">
        <span class="moving-node-dot" aria-hidden="true"></span><span class="moving-node-label"><b>HOST</b><small>CREATE A GAME</small></span>
      </a>
      <a class="play-moving-node join-node" href="/game/join/" aria-label="Join a game">
        <span class="moving-node-dot" aria-hidden="true"></span><span class="moving-node-label"><b>JOIN</b><small>FRIENDS // PUBLIC // CODE</small></span>
      </a>
      <a class="play-moving-node global-node" href="/game/global/" aria-label="Enter Global">
        <span class="moving-node-dot" aria-hidden="true"></span><span class="moving-node-label"><b>GLOBAL</b><small>SHARED WORLD</small></span>
      </a>

      <div class="play-core" data-parallax-item>
        <div class="play-core-ring ring-a"></div><div class="play-core-ring ring-b"></div>
        <div class="play-core-copy"><p>EXTERNAL REALITY ACCESS SYSTEM</p><h1>PLAY</h1><span>HOVER A MOVING NODE TO HOLD ITS ORBIT.</span></div>
      </div>
    </section>
    <p class="platform-line">HOST&nbsp; // &nbsp;JOIN&nbsp; // &nbsp;GLOBAL</p>
  </main>
  <script src="./assets/js/site.js"></script>
  <script type="module" src="/account/assets/js/account.js"></script>
<script type="module" src="/game/global/messaging.js?v=20260901-dm5"></script>
</body>
</html>
