<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; connect-src https://*.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://*.google.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>LCS Secure Sign-in</title>
<style>html,body{min-height:100%;margin:0;background:#0b0712;color:#f6f0ff;font:16px system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:28px;box-sizing:border-box}.card{max-width:560px;border:1px solid #3a2d4a;border-radius:24px;padding:28px;background:#140b20;text-align:center;box-shadow:0 24px 80px #0008}.spinner{width:38px;height:38px;border-radius:50%;border:4px solid #ffffff22;border-top-color:#fff;margin:0 auto 18px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 18px;margin-top:14px}small{display:block;color:#b9adc6;margin-top:14px}</style>
</head>
<body><main><section class="card"><div class="spinner" id="spinner"></div><h1 id="title">Connecting securely to Google…</h1><p id="message">LCS is using Firebase's own first-party authentication origin for this mobile sign-in.</p><button id="retry" hidden>Retry sign-in</button><small>No Google profile information is copied into the public LCS profile.</small></section></main><script type="module" src="/lcs-auth-bridge.js"></script></body>
</html>
