<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080d16">
  <title>Opening Archive Entry — Project E.R.A.S.</title>
  <script>
    (function () {
      var prefix = '/archives/';
      var path = location.pathname;
      if (!path.startsWith(prefix)) return;
      var id = path.slice(prefix.length).replace(/\/+$/, '');
      if (!id || id.includes('/')) return;
      try { id = decodeURIComponent(id); } catch (_) {}
      location.replace(prefix + '?entry=' + encodeURIComponent(id) + location.hash);
    })();
  </script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d16;color:#e9f1fc;font:16px/1.6 system-ui,sans-serif}.card{max-width:520px;margin:24px;padding:32px;border:1px solid #ffffff20;border-radius:16px;background:#111b29;text-align:center}h1{margin:0 0 8px;font-size:26px}p{color:#a8b8ce}a{color:#63e6ed}
  </style>
</head>
<body><main class="card"><h1>Page not found</h1><p><a href="/archives/">Return to the E.R.A.S. Archives</a></p></main></body>
</html>
